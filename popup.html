<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Enterprise Bridge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <path d="M12 2.5C12.7 7.4 16.6 11.3 21.5 12C16.6 12.7 12.7 16.6 12 21.5C11.3 16.6 7.4 12.7 2.5 12C7.4 11.3 11.3 7.4 12 2.5Z" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1>Gemini Enterprise</h1>
          <p class="subtitle">本地智能网关连接器</p>
        </div>
      </div>
      <div class="header-right">
        <span class="save-toast" id="saveToast" hidden>已自动生效</span>
        <label class="switch" title="启用或暂停桥接">
          <input type="checkbox" id="enabledToggle" checked />
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <section class="hero-card" id="heroCard" aria-live="polite">
      <div class="hero-top">
        <span class="status-dot" id="heroDot"></span>
        <div class="hero-copy">
          <div class="hero-title" id="heroTitle">正在检查连接状态...</div>
          <div class="hero-sub" id="heroSub">正在同步本地服务与浏览器工作页</div>
        </div>
      </div>

      <div class="metrics-strip">
        <div class="metric-item">
          <span class="metric-label">本地服务</span>
          <span class="pill" id="wsStatusPill">检测中</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">接管工作池</span>
          <span class="metric-val truncate" id="tabStatusText">-</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">手动自用页</span>
          <span class="metric-val truncate" id="rpcStatusText">-</span>
        </div>
      </div>

      <button type="button" id="openVertexBtn" class="btn subtle-cta" hidden>
        一键打开 Google 登录页
      </button>
      <p class="error-banner" id="errorBanner" hidden></p>
    </section>

    <button type="button" id="openConsoleBtn" class="btn primary console-btn">
      <span class="console-btn-main">
        <span class="console-btn-title">打开本地控制台</span>
        <span class="console-btn-sub">查看省钱账本 · 工作席位 · 一键体检</span>
      </span>
      <span class="console-port">8000 ↗</span>
    </button>

    <section class="control-card">
      <div class="cur-tab-panel" id="curTabPanel">
        <div class="cur-tab-head">
          <span class="field-title" id="curTabTitle">当前浏览标签页</span>
          <span class="pill" id="curTabBadge">检测中</span>
        </div>
        <p class="cur-tab-desc" id="curTabDesc">正在识别当前窗口的 Gemini 页面接管状态...</p>
        <button type="button" id="toggleManualBtn" class="btn manual-toggle-btn">
          设为我自己用 · 不接管此会话
        </button>
        <button type="button" id="openManualTabBtn" class="btn manual-toggle-btn to-bridge" hidden>
          + 新开自用 Gemini 聊天页（免接管）
        </button>
      </div>

      <div class="pool-controls" id="poolControlsWrap">
        <div class="field-head">
          <span class="field-title">Bridge 接管页数上限</span>
          <label class="inline-check" title="请求繁忙时自动在后台新开工作页">
            <input type="checkbox" id="autoSpawnCheck" checked />
            <span>繁忙时自动多开</span>
          </label>
        </div>
        <div class="pool-rule-note">默认自动接管打开的聊天页；超出上限或手动自用页不接入</div>
        <div class="seg-group" id="maxTabsSegments" role="group" aria-label="自动开页上限">
          <button type="button" class="seg-btn" data-val="1">1 页</button>
          <button type="button" class="seg-btn" data-val="5">5 页</button>
          <button type="button" class="seg-btn" data-val="10">10 页</button>
          <button type="button" class="seg-btn" id="customTabsBtn" data-val="custom">自定义</button>
        </div>
        <div class="custom-cap-row" id="customTabsRow" hidden>
          <input type="number" id="customTabsInput" min="1" max="200" step="1" inputmode="numeric" placeholder="输入席位数字 (1~200)" aria-label="自定义席位数字" />
          <button type="button" id="customTabsApplyBtn" class="btn small primary custom-cap-apply">确定</button>
        </div>
        <div hidden>
          <select id="autoSpawnSelect">
            <option value="true">开启</option>
            <option value="false">关闭</option>
          </select>
          <select id="maxTabsSelect">
            <option value="1">1</option>
            <option value="5">5</option>
            <option value="10" selected>10</option>
          </select>
        </div>
      </div>
    </section>

    <details class="drawer">
      <summary class="drawer-summary">
        <span>故障排查与高级设置</span>
        <span class="drawer-chevron" aria-hidden="true">▾</span>
      </summary>
      <div class="drawer-body">
        <div class="tool-grid">
          <button type="button" id="reconnectBtn" class="btn small">重连本地服务</button>
          <button type="button" id="spawnTabBtn" class="btn small">+ 手动加开一页</button>
          <button type="button" id="newChatBtn" class="btn small">当前页换新对话</button>
          <button type="button" id="diagnoseBtn" class="btn small">检测页面结构</button>
        </div>

        <label class="field compact">
          <span class="field-title">连接地址</span>
          <input type="url" id="wsUrlInput" placeholder="ws://127.0.0.1:8000/ws/browser" />
        </label>

        <label class="field compact">
          <span class="field-title">底层驱动模式</span>
          <select id="driverModeSelect">
            <option value="auto">自动混合模式（推荐）</option>
            <option value="dom">纯页面组件驱动</option>
            <option value="replay">页面请求重放</option>
          </select>
        </label>

        <details class="sub-drawer">
          <summary>自定义页面元素定位（仅网页改版时用）</summary>
          <div class="advanced-fields">
            <input type="text" id="modelSelector" placeholder="模型选择器（默认自动识别）" />
            <input type="text" id="inputSelector" placeholder="输入框选择器（默认自动识别）" />
            <input type="text" id="sendSelector" placeholder="发送按钮选择器（默认自动识别）" />
            <input type="text" id="replySelector" placeholder="回复区域选择器（默认自动识别）" />
          </div>
        </details>

        <button type="button" id="saveBtn" class="btn small full">应用高级参数</button>

        <div class="logs-section">
          <div class="logs-header">
            <span>最近连接记录</span>
            <button type="button" id="clearLogsBtn" class="link-btn">清空</button>
          </div>
          <pre id="diagOutput" class="log-box">就绪</pre>
        </div>
      </div>
    </details>
  </main>

  <script src="popup.js"></script>
</body>
</html>
